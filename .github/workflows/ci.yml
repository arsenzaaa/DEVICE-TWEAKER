name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Python for release checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Check release recovery without network access
        run: python -m unittest discover -s dev/release -p test_replace_release.py -v

      - name: Restore
        run: dotnet restore DeviceTweaker.sln

      - name: Check Windows PowerShell scripts
        shell: powershell
        run: |
          foreach ($script in (git ls-files '*.ps1')) {
            $path = (Resolve-Path -LiteralPath $script).Path
            $bytes = [IO.File]::ReadAllBytes($path)
            $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 239 -and $bytes[1] -eq 187 -and $bytes[2] -eq 191
            $hasNonAscii = @($bytes | Where-Object { $_ -gt 127 } | Select-Object -First 1).Count -gt 0
            if ($hasNonAscii -and -not $hasBom) { throw "UTF-8 BOM required for Windows PowerShell 5.1: $script" }
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "PowerShell parse error in ${script}: $($parseErrors[0].Message)" }
          }

      - name: Check QA build cache contracts
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File dev/qa/Test-QaBuildCache.ps1

      - name: Check release application identities
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File dev/qa/Test-PackageIdentity.ps1

      - name: Build developer workbench from checkout
        shell: powershell
        run: |
          . ./dev/qa/Build-Cache.ps1
          $build = Get-QaDevBuild (Get-Location).Path
          Write-Output ('Verified QA build: ' + $build.key)

      - name: Build
        run: dotnet build "src/DeviceTweakerCS.csproj" -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Test
        run: dotnet test "dev/qa/tests/DeviceTweaker.Tests/DeviceTweaker.Tests.csproj" -c Release --no-restore --logger "console;verbosity=normal"
