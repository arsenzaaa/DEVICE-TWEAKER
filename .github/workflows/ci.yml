name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DeviceTweaker.sln

      - name: Check Windows PowerShell scripts
        shell: powershell
        run: |
          foreach ($script in (git ls-files '*.ps1')) {
            $path = (Resolve-Path -LiteralPath $script).Path
            $bytes = [IO.File]::ReadAllBytes($path)
            $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 239 -and $bytes[1] -eq 187 -and $bytes[2] -eq 191
            $hasNonAscii = @($bytes | Where-Object { $_ -gt 127 } | Select-Object -First 1).Count -gt 0
            if ($hasNonAscii -and -not $hasBom) { throw "UTF-8 BOM required for Windows PowerShell 5.1: $script" }
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "PowerShell parse error in ${script}: $($parseErrors[0].Message)" }
          }

      - name: Build
        run: dotnet build "DEVICE TWEAKER/DeviceTweakerCS.csproj" -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Test
        run: dotnet test "DEVICE TWEAKER/tests/DeviceTweaker.Tests/DeviceTweaker.Tests.csproj" -c Release --no-restore --logger "console;verbosity=normal"
