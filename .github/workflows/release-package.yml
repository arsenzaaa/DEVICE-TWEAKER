name: Release package

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source commit (40-character SHA)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-package
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify source and version
        id: source
        shell: pwsh
        env:
          SELECTED_SHA: ${{ inputs.source_sha }}
        run: |
          if ($env:SELECTED_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Use the exact source SHA' }
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:SELECTED_SHA) { throw 'Checkout differs from selected source' }
          [xml]$project = Get-Content -LiteralPath 'src/DeviceTweakerCS.csproj'
          $version = [string]($project.Project.PropertyGroup.InformationalVersion | Where-Object { $_ } | Select-Object -First 1)
          if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') { throw 'Expected a numeric release version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "package=src/bin/ReleasePackages/v$version" >> $env:GITHUB_OUTPUT
          if (git status --porcelain) { throw 'Source checkout is dirty' }

      - name: Restore and test
        shell: pwsh
        run: |
          dotnet restore DeviceTweaker.sln
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed' }
          dotnet build 'src/DeviceTweakerCS.csproj' -c Release --no-restore -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          dotnet test 'dev/qa/tests/DeviceTweaker.Tests/DeviceTweaker.Tests.csproj' -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }

      - name: Build and inspect both EXEs
        shell: pwsh
        env:
          PACKAGE: ${{ steps.source.outputs.package }}
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'src/build.ps1' -Flavor both -Configuration Release -SkipImodDriverBuild
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'dev/qa/Test-ReleasePackage.ps1' -PackageDirectory $env:PACKAGE
          if ($LASTEXITCODE -ne 0) { throw 'Package inspection failed' }

      - name: Save package for inspection
        uses: actions/upload-artifact@v7
        with:
          name: DEVICE-TWEAKER-v${{ steps.source.outputs.version }}-${{ inputs.source_sha }}
          path: ${{ steps.source.outputs.package }}/
          if-no-files-found: error
