name: Hardware report / Отчёт об оборудовании
description: How the program works on your hardware / Как программа работает на вашей конфигурации
labels: [hardware]
body:
  - type: markdown
    attributes:
      value: |
        If available, include log excerpts from before applying, right after, and after restarting Windows.
        Если сохранились логи до применения, сразу после него и после перезагрузки Windows, приложите нужные фрагменты.

        Remove personal paths, names and serial numbers before attaching files.
        Уберите из файлов личные пути, имена и серийные номера.

        [Record an ISR/DPC trace](https://github.com/arsenzaaa/DEVICE-TWEAKER/blob/main/docs/guide/10-verification.md#inspecting-a-trace).
        [Записать трассу ISR/DPC](https://github.com/arsenzaaa/DEVICE-TWEAKER/blob/main/docs/guide/10-verification.ru.md#просмотр-трассы).
  - type: input
    id: version
    attributes:
      label: Version / Версия
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Configuration / Конфигурация
      description: CPU, motherboard, BIOS, Windows build, USB controllers, network adapter, GPU / CPU, материнская плата, BIOS, сборка Windows, USB-контроллеры, сетевая карта, GPU
    validations:
      required: true
  - type: checkboxes
    id: features
    attributes:
      label: What you tested / Что проверяли
      options:
        - label: Auto-optimization / Автооптимизация
        - label: MSI / Affinity
        - label: USB IMOD
        - label: NIC ITR
        - label: RSS
        - label: ReservedCpuSets
        - label: Restore / Восстановление
  - type: textarea
    id: result
    attributes:
      label: Result / Результат
      description: What was applied, what CHECK showed, any problems / Какие параметры применились, что показала проверка и какие ошибки возникли
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Логи
      description: Attach the relevant log excerpts / Приложите фрагменты журнала с нужными операциями
  - type: textarea
    id: trace
    attributes:
      label: Trace (optional) / Трасса (необязательно)
      description: An xperf -a dpcisr report or .etl file before and after applying / Отчёт xperf -a dpcisr или файл .etl до и после применения
