name: Hardware report / Отчёт о железе
description: How the program works on your hardware / Как программа работает на вашей конфигурации
labels: [hardware]
body:
  - type: markdown
    attributes:
      value: |
        These reports help verify auto-optimization, IMOD and NIC ITR on different hardware. Three logs help most: before applying, right after, and after a restart.
        Такие отчёты помогают проверить AUTO, IMOD и NIC ITR на разном железе. Полезнее всего три лога: до применения, сразу после и после перезагрузки.

        Remove personal paths, names and serial numbers before attaching files.
        Уберите из файлов личные пути, имена и серийные номера.

        How to record an ISR/DPC trace: [guide chapter 10](https://github.com/arsenzaaa/DEVICE-TWEAKER/blob/main/docs/guide/10-verification.md).
        Как записать трейс ISR/DPC: [глава 10 на русском](https://github.com/arsenzaaa/DEVICE-TWEAKER/blob/main/docs/guide/10-verification.ru.md).
  - type: input
    id: version
    attributes:
      label: Version / Версия
      placeholder: 0.0.4
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Configuration / Конфигурация
      description: CPU, motherboard, BIOS, Windows build, USB controllers, network adapter, GPU / CPU, материнская плата, BIOS, сборка Windows, USB-контроллеры, сетевая карта, GPU
    validations:
      required: true
  - type: checkboxes
    id: features
    attributes:
      label: What you tested / Что проверяли
      options:
        - label: Auto-optimization / Авто-оптимизация
        - label: MSI / Affinity
        - label: USB IMOD
        - label: NIC ITR
        - label: RSS
        - label: ReservedCpuSets
        - label: Restore / Восстановление
  - type: textarea
    id: result
    attributes:
      label: Result / Результат
      description: What was applied, what CHECK showed, any problems / Что применилось, что показал ПРОВЕРИТЬ, были ли проблемы
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Логи
      description: Drag the files from the logs folder / Перетащите файлы из папки logs
  - type: textarea
    id: trace
    attributes:
      label: Trace (optional) / Трейс (необязательно)
      description: An xperf -a dpcisr report or .etl file before and after applying / Отчёт xperf -a dpcisr или файл .etl до и после применения
