name: Bug report / Ошибка
description: Report a crash or unexpected behavior / Сообщить о сбое или ошибке в работе
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Build / Сборка
      description: Copy the LOG.VERSION line from the logs folder next to the EXE, or enter the version shown in the window. / Скопируйте строку LOG.VERSION из лога в папке logs рядом с EXE или укажите версию из окна программы.
      placeholder: product=0.1.0 build=…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Как повторить
      description: List the device, the setting you changed and whether you restarted Windows. / Укажите устройство, изменённую настройку и уточните, выполнялась ли перезагрузка Windows.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result / Что ожидали и что произошло
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt / Фрагмент лога
      description: Paste the lines for the affected operation. Remove personal paths, names and serial numbers. / Вставьте строки лога, относящиеся к проблемной операции. Уберите личные пути, имена и серийные номера.
      render: text
  - type: textarea
    id: attachments
    attributes:
      label: Additional evidence / Дополнительные данные
      description: For a restore issue, attach the relevant anonymized backup. For a startup issue, attach the relevant startup log. / При ошибке восстановления приложите обезличенный бэкап. При ошибке автозапуска приложите лог этой попытки.
