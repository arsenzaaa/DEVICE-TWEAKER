name: Сообщить об ошибке
description: Если DEVICE TWEAKER показывает или применяет что-то неправильно
title: "[Баг]: "
labels: [bug]
body:
  - type: input
    attributes:
      label: Версия программы
      description: Номер релиза и сборка EXE (обычная или автономная)
    validations:
      required: true
  - type: textarea
    attributes:
      label: Система и устройство
      description: Сборка Windows, CPU, материнская плата, BIOS, Hardware ID устройства и версия драйвера
    validations:
      required: true
  - type: textarea
    attributes:
      label: Как повторить
      description: Что нажали и в каком порядке
    validations:
      required: true
  - type: textarea
    attributes:
      label: Ожидали и получили
    validations:
      required: true
  - type: dropdown
    attributes:
      label: После этого перезагружали Windows?
      options: ["Да", "Нет", "Не относится к ошибке"]
    validations:
      required: true
  - type: textarea
    attributes:
      label: Фрагмент лога
      description: Приложите строки, относящиеся к ошибке
      render: text
