<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="220" role="img" aria-labelledby="title desc">
  <title id="title">DEVICE TWEAKER</title>
  <desc id="desc">DEVICE TWEAKER — Advanced Interrupt, CPU Affinity and USB IMOD Tuning for Windows</desc>
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0052cc" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0052cc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00a3ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00a3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052cc" stop-opacity="0"/>
      <stop offset="25%" stop-color="#0066ff"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="75%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#0052cc" stop-opacity="0"/>
    </linearGradient>
    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f293d" stroke-width="0.5" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Frame -->
  <rect width="960" height="220" rx="14" fill="url(#bgGrad)" stroke="#1a2333" stroke-width="1.5"/>
  <rect width="960" height="220" rx="14" fill="url(#grid)"/>
  <rect width="960" height="220" rx="14" fill="url(#glowLeft)"/>
  <rect width="960" height="220" rx="14" fill="url(#glowRight)"/>

  <!-- Top Accent Highlight -->
  <path d="M 280 1 L 680 1" stroke="url(#accentLine)" stroke-width="2"/>

  <!-- Main Wordmark -->
  <g fill="#ffffff" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Bahnschrift', Roboto, Helvetica, Arial, sans-serif">
    <text x="480" y="108" font-size="52" font-weight="900" letter-spacing="14">DEVICE TWEAKER</text>
  </g>

  <!-- Divider Line -->
  <rect x="230" y="136" width="500" height="2" fill="url(#accentLine)"/>

  <!-- Technical Feature Pills -->
  <g fill="#8fa0b5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Bahnschrift', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="4">
    <text x="480" y="172">MSI · CPU AFFINITY · USB IMOD · RSS &amp; NIC ITR</text>
  </g>
